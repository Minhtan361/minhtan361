<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Làm Việc</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --dept-bg: #0f172a; /* Slate tối sang trọng */
            
            /* BỘ MÀU PASTEL 3 CA LÀM + OFF (DỊU MẮT, RÕ RÀNG) */
            /* Ca OFF */
            --off-bg: #dd3f3f;
            --off-text: #f0e2e2;
            --off-border: #eccdcd;

            /* Ca 1: Ca Gãy / Cả Ngày (Vàng Hổ Phách Pastel) */
            --ca1-bg: #aeeebe;
            --ca1-text: #050301;
            --ca1-border: #fef08a;

            /* Ca 2: Ca Sáng / Trưa (Xanh Băng Pastel) */
            --ca2-bg: #b9dcf3;
            --ca2-text: #000507;
            --ca2-border: #bae6fd;

            /* Ca 3: Ca Chiều / Tối (Tím Thạch Anh Pastel) */
            --ca3-bg: #e0cbb2;
            --ca3-text: #11021f;
            --ca3-border: #e9d5ff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top left, #dbeafe 0, transparent 32%), var(--bg-main);
            color: var(--text-primary);
            padding: 24px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1380px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.01);
            border: 1px solid var(--border-color);
        }

        /* THANH ĐIỀU HƯỚNG TỔNG QUAN */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .title-area h2 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .title-area p {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 5px 9px;
            border-radius: 999px;
            background: #ecfdf5;
            color: #047857;
            font-size: 11px;
            font-weight: 800;
        }

        .connection-status::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .connection-status.offline {
            background: #fff7ed;
            color: #c2410c;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mode-btn {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }

        .mode-btn.view-active {
            background-color: #059669;
            box-shadow: 0 2px 4px rgba(5, 150, 105, 0.2);
        }

        .week-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 8px;
        }

        .btn-week {
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-week:hover { background: #ffffff; }

        .week-range {
            font-weight: 700;
            font-size: 13px;
            padding: 0 8px;
            color: #334155;
        }

        /* KHU VỰC CÀI ĐẶT (CHỈ HIỆN KHI CHỈNH SỬA) */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 14px;
            border-radius: 10px;
            border: 1px dashed #cbd5e1;
        }

        .control-box {
            display: flex;
            gap: 8px;
        }

        .control-box input, .control-box select {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            background: #fff;
        }
        
        .control-box input:focus { border-color: #2563eb; }

        .color-settings { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
        .color-settings-title { font-size: 12px; font-weight: 800; color: #334155; }
        .shift-color-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
        .shift-color-item {
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: max-content;
            padding: 4px 6px;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #334155;
        }
        .shift-color-item input[type="color"] {
            flex: none;
            width: 25px;
            height: 22px;
            padding: 1px;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .btn-add {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }

        /* BẢNG LỊCH PHÂN CONG - CÂN XỨNG & TINH TẾ */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: center;
            table-layout: fixed;
        }

        th, td {
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        th:last-child, td:last-child { border-right: none; }

        /* Tiêu đề Thứ Ngày */
        .header-row th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 700;
            font-size: 13px;
            padding: 12px 6px;
        }

        .header-row th.emp-col {
            width: 130px;
            text-align: left;
            padding-left: 16px;
            color: #0f172a;
            font-weight: 800;
        }

        /* Tiêu đề Bộ Phận */
        .dept-row td {
            background-color: var(--dept-bg);
            color: #ffffff;
            font-weight: 800;
            font-size: 13px;
            text-align: left;
            padding: 10px 16px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Tên Nhân Viên */
        .emp-name-cell {
            background-color: #ffffff;
            font-weight: 700;
            font-size: 13.5px;
            text-align: left;
            padding-left: 16px;
            color: #1e293b;
        }

        /* CÁC Ô GIỜ LÀM VIỆC (CELLS) */
        .shift-cell {
            height: 64px; /* Chiều cao cố định chuẩn cân xứng */
            padding: 4px;
            transition: all 0.15s ease;
        }

        /* THIẾT KẾ THẺ CA LÀM (BADGE CARD) */
        .shift-badge {
            height: 100%;
            width: 100%;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4px 6px;
            border: 1px solid transparent;
            gap: 2px;
        }

        .time-text {
            font-size: 12px;
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.01em;
        }

        .note-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.06);
            margin-top: 2px;
        }

        /* 3 MÀU 3 KHUNG GIỜ + OFF PASTEL */
        .shift-off { background-color: var(--shift-bg, var(--off-bg)); color: var(--off-text); border-color: var(--shift-border, var(--off-border)); }
        .shift-off .time-text { font-size: 13px; font-weight: 800; }
        
        .shift-ca1 { background-color: var(--shift-bg, var(--ca1-bg)); color: var(--ca1-text); border-color: var(--shift-border, var(--ca1-border)); }
        .shift-ca2 { background-color: var(--shift-bg, var(--ca2-bg)); color: var(--ca2-text); border-color: var(--shift-border, var(--ca2-border)); }
        .shift-ca3 { background-color: var(--shift-bg, var(--ca3-bg)); color: var(--ca3-text); border-color: var(--shift-border, var(--ca3-border)); }

        /* ĐỊNH DẠNG Ở CHẾ ĐỘ CHỈNH SỬA */
        .edit-select {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 12px;
            font-weight: 700;
            color: inherit;
            text-align: center;
            text-align-last: center;
            outline: none;
            cursor: pointer;
        }

        .edit-note-input {
            width: 85%;
            border: 1px dashed rgba(0,0,0,0.25);
            border-radius: 4px;
            font-size: 11px;
            text-align: center;
            font-weight: 700;
            color: var(--shift-contrast, inherit);
            background: rgba(255, 255, 255, 0.5);
            outline: none;
            padding: 2px 4px;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        .edit-note-input.note-has-content {
            border: 2px solid #dc2626;
            background: rgba(255, 255, 255, 0.82);
        }
        .edit-note-input:focus { border-color: #2563eb; background: #fff; }

        .note-tag {
            color: var(--shift-contrast, inherit);
            background: rgba(255, 255, 255, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 2px 6px;
        }

        /* Ẩn bớt công cụ ở Chế độ Xem */
        .is-view-mode .controls-grid { display: none !important; }

        @media (max-width: 760px) {
            body { padding: 10px; }
            .container { padding: 14px; border-radius: 12px; }
            .header-bar { align-items: flex-start; flex-direction: column; gap: 14px; }
            .nav-actions { width: 100%; align-items: stretch; flex-direction: column; }
            .mode-btn, .week-selector { width: 100%; }
            .week-selector { justify-content: space-between; }
            .controls-grid { grid-template-columns: 1fr; }
            .table-wrapper { margin: 0 -2px; }
            table { min-width: 850px; }
        }

        button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.35);
            outline-offset: 2px;
        }

        body, .container, .container * {
            color: #000000;
        }

        .container input::placeholder {
            color: #000000;
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container" id="appContainer">
    <!-- HEADER ĐIỀU HƯỚNG -->
    <div class="header-bar">
        <div class="title-area">
            <h2>THAI THAE</h2>
            <p>Lịch làm</p>
            <span class="connection-status offline" id="connectionStatus" role="status">Đang kết nối Firebase...</span>
        </div>

        <div class="nav-actions">
            <button class="mode-btn" id="toggleModeBtn" onclick="toggleMode()">
                ✏️ Chế độ: Chỉnh sửa
            </button>

            <button class="mode-btn" type="button" onclick="exportScheduleToPNG()">
                🖼️ Xuất PNG
            </button>

            <div class="week-selector">
                <button class="btn-week" onclick="changeWeek(-1)">‹</button>
                <span class="week-range" id="weekTitle">Đang tải...</span>
                <button class="btn-week" onclick="changeWeek(1)">›</button>
            </div>
        </div>
    </div>

    <!-- KHU VỰC CÀI ĐẶT (CHỈ HIỆN KHI Ở CHẾ ĐỘ CHỈNH SỬA) -->
    <div class="controls-grid">
        <div class="control-box">
            <input type="text" id="shiftInput" placeholder="Thêm ca mới (VD: 09:00 - 14:00)...">
            <button class="btn-add" style="background:#2563eb" onclick="addShift()">+ Thêm Ca</button>
        </div>
        <div class="control-box">
            <input type="text" id="empName" placeholder="Tên nhân viên...">
            <select id="empDept">
                <option value="BẾP">BẾP</option>
                <option value="PHỤC VỤ & THU NGÂN">PHỤC VỤ & THU NGÂN</option>
            </select>
            <button class="btn-add" style="background:#059669" onclick="addEmployee()">+ Thêm NV</button>
        </div>
        <div class="control-box">
            <select id="deleteEmpSelect"><option value="">-- Chọn NV cần xóa --</option></select>
            <button class="btn-add" style="background:#dc2626" onclick="deleteEmployee()">Xóa NV</button>
        </div>
        <div class="color-settings">
            <span class="color-settings-title">Màu ca làm</span>
            <div class="shift-color-list" id="shiftColorList"></div>
        </div>
    </div>

    <!-- BẢNG PHÂN CONG GIAO DIỆN MỚI -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr class="header-row" id="dateHeaderRow">
                    <th class="emp-col">Tên NV</th>
                </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCexNUfw-tC7c4jx2HM41x1dL85DijkZiE",
        authDomain: "lichlamviec-4b977.firebaseapp.com",
        projectId: "lichlamviec-4b977",
        storageBucket: "lichlamviec-4b977.firebasestorage.app",
        messagingSenderId: "1011750021990",
        appId: "1:1011750021990:web:6aca1e42668defde9f76a7"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const scheduleDoc = db.collection('apps').doc('schedule');

    const DAYS_VN = ["Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7", "Chủ nhật"];
    let isEditMode = true;
    let currentWeekOffset = 0;

    // Dữ liệu ban đầu
    const defaultDatabase = {
        departments: ["BẾP", "PHỤC VỤ & THU NGÂN"],
        shifts: [
            "OFF",
            "09:00 - 14:00 / 17:00 - 23:00",
            "09:00 - 13:00 / 17:00 - 23:00",
            "09:00 - 23:00",
            "13h - 23h",
            "14h - 23h",
            "08:30 - 15:00",
            "17:30 - 23:00",
            "10h - 16h"
        ],
        employees: [
            { id: 1, name: "Nghĩa", dept: "BẾP" },
            { id: 2, name: "Ngân", dept: "BẾP" },
            { id: 3, name: "Sinh", dept: "BẾP" },
            { id: 4, name: "Khôi", dept: "BẾP" },
            { id: 5, name: "Tân", dept: "PHỤC VỤ & THU NGÂN" },
            { id: 6, name: "Hương", dept: "PHỤC VỤ & THU NGÂN" }
        ],
        schedules: {},
        shiftColors: {
            "OFF": "#dd3f3f",
            "09:00 - 14:00 / 17:00 - 23:00": "#aeeebe",
            "09:00 - 13:00 / 17:00 - 23:00": "#aeeebe",
            "09:00 - 23:00": "#b9dcf3",
            "13h - 23h": "#e0cbb2",
            "14h - 25h": "#e0cbb2",
            "08:30 - 15:00": "#b9dcf3",
            "17:30 - 23:00": "#e0cbb2",
            "10h - 16h": "#b9dcf3"
        }
    };
    let database = JSON.parse(localStorage.getItem('SCHEDULE_ELEGANT_DB')) || defaultDatabase;
    database.shiftColors = database.shiftColors || {};
    let isFirebaseReady = false;
    let isRemoteUpdate = false;

    function updateConnectionStatus(online, message) {
        const status = document.getElementById('connectionStatus');
        if (!status) return;
        status.textContent = message;
        status.classList.toggle('offline', !online);
    }

    function saveData() {
        localStorage.setItem('SCHEDULE_ELEGANT_DB', JSON.stringify(database));
        if (isRemoteUpdate) return;
        scheduleDoc.set({ database, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
            .then(() => {
                isFirebaseReady = true;
                updateConnectionStatus(true, 'Đã đồng bộ trực tuyến');
            })
            .catch(error => {
                console.error('Không thể lưu lịch lên Firebase:', error);
                updateConnectionStatus(false, 'Đang dùng dữ liệu trên máy');
            });
    }

    function loadFirebaseData() {
        scheduleDoc.onSnapshot(snapshot => {
            if (snapshot.exists && snapshot.data().database) {
                isRemoteUpdate = true;
                database = snapshot.data().database;
                database.shiftColors = database.shiftColors || {};
                localStorage.setItem('SCHEDULE_ELEGANT_DB', JSON.stringify(database));
                renderAll();
                isRemoteUpdate = false;
            } else {
                saveData();
            }
            isFirebaseReady = true;
            updateConnectionStatus(true, 'Đã đồng bộ trực tuyến');
        }, error => {
            console.error('Không thể tải lịch từ Firebase:', error);
            updateConnectionStatus(false, 'Ngoại tuyến · dữ liệu tạm thời');
        });
    }

    function toggleMode() {
        isEditMode = !isEditMode;
        const btn = document.getElementById('toggleModeBtn');
        const container = document.getElementById('appContainer');

        if (isEditMode) {
            btn.innerHTML = "✏️ Chế độ: Chỉnh sửa";
            btn.classList.remove('view-active');
            container.classList.remove('is-view-mode');
        } else {
            btn.innerHTML = "👁️ Chế độ: Xem ";
            btn.classList.add('view-active');
            container.classList.add('is-view-mode');
        }
        renderAll();
    }

    function changeWeek(dir) { currentWeekOffset += dir; renderAll(); }

    function getStartOfWeek(offset = 0) {
        const d = new Date();
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(d.setDate(diff));
        monday.setDate(monday.getDate() + (offset * 7));
        return monday;
    }

    function getWeekKey(date) { return date.toISOString().split('T')[0]; }

    function addShift() {
        const input = document.getElementById('shiftInput');
        const val = input.value.trim();
        if (val && !database.shifts.includes(val)) {
            database.shifts.push(val);
            database.shiftColors[val] = getDefaultShiftColor(val);
            saveData(); renderAll(); input.value = '';
        }
    }

    function getDefaultShiftColor(time) {
        const styleClass = getShiftStyleClass(time);
        if (styleClass === 'shift-off') return '#dd3f3f';
        if (styleClass === 'shift-ca1') return '#aeeebe';
        if (styleClass === 'shift-ca2') return '#b9dcf3';
        return '#e0cbb2';
    }

    function getContrastColor(hexColor) {
        const hex = hexColor.replace('#', '');
        if (hex.length !== 6) return '#0f172a';
        const red = parseInt(hex.slice(0, 2), 16);
        const green = parseInt(hex.slice(2, 4), 16);
        const blue = parseInt(hex.slice(4, 6), 16);
        const luminance = (red * 299 + green * 587 + blue * 114) / 1000;
        return luminance > 155 ? '#0f172a' : '#ffffff';
    }

    function updateShiftColor(shift, color) {
        database.shiftColors[shift] = color;
        saveData();
        renderAll();
    }

    function addEmployee() {
        const name = document.getElementById('empName').value.trim();
        const dept = document.getElementById('empDept').value;
        if (!name) return alert('Vui lòng nhập tên nhân viên!');
        database.employees.push({ id: Date.now(), name: name, dept: dept });
        saveData(); renderAll(); document.getElementById('empName').value = '';
    }

    function deleteEmployee() {
        const empId = document.getElementById('deleteEmpSelect').value;
        if (!empId) return;
        if (confirm("Chắc chắn muốn xóa nhân viên này?")) {
            database.employees = database.employees.filter(e => e.id != empId);
            saveData(); renderAll();
        }
    }

    function updateShift(empId, dayIdx, field, val) {
        const weekKey = getWeekKey(getStartOfWeek(currentWeekOffset));
        if (!database.schedules[weekKey]) database.schedules[weekKey] = {};
        if (!database.schedules[weekKey][empId]) database.schedules[weekKey][empId] = Array(7).fill({ time: "OFF", note: "" });

        const currentData = JSON.parse(JSON.stringify(database.schedules[weekKey][empId]));
        currentData[dayIdx][field] = val.trim();

        database.schedules[weekKey][empId] = currentData;
        saveData();
        renderAll();
    }

    function handleEnter(event, action) {
        if (event.key === 'Enter') {
            event.preventDefault();
            action();
        }
    }

    async function exportScheduleToPNG() {
        if (typeof html2canvas !== 'function') {
            alert('Chưa tải được công cụ xuất ảnh. Vui lòng thử lại sau.');
            return;
        }

        const source = document.getElementById('appContainer');
        const clone = source.cloneNode(true);
        const sourceTable = source.querySelector('table');
        const exportWidth = Math.max(source.offsetWidth, sourceTable ? sourceTable.scrollWidth : 0);
        clone.style.width = `${exportWidth}px`;
        clone.style.maxWidth = 'none';
        clone.style.position = 'absolute';
        clone.style.left = '-100000px';
        clone.style.top = '0';
        clone.style.boxShadow = 'none';
        clone.querySelector('.table-wrapper').style.overflow = 'visible';
        document.body.appendChild(clone);

        try {
            const canvas = await html2canvas(clone, {
                backgroundColor: '#f8fafc',
                scale: 2,
                useCORS: true,
                logging: false
            });
            const link = document.createElement('a');
            link.download = `lich-lam-viec-${getWeekKey(getStartOfWeek(currentWeekOffset))}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        } finally {
            clone.remove();
        }
    }

    // sa
    function getShiftStyleClass(time) {
        if (!time || time === 'OFF') return 'shift-off';
        
        // Ca Gãy hoặc Ca Cả Ngày (có dấu '/' hoặc từ sáng đến tối mịt) -> Ca 1 (Vàng Hổ Phách Pastel)
        if (time.includes('/') || time.includes('23:00') && (time.startsWith('08') || time.startsWith('09'))) {
            return 'shift-ca1';
        }
        
        // Ca Sáng / Trưa (bắt đầu trước 13h) -> Ca 2 (Xanh Băng Pastel)
        const match = time.match(/(\d{1,2})[:hH]/);
        if (match) {
            const startHour = parseInt(match[1], 10);
            if (startHour < 13) return 'shift-ca2';
        }

        // Ca Chiều / Tối -> Ca 3 (Tím Thạch Anh Pastel)
        return 'shift-ca3';
    }

    // FORMAT HIỂN THỊ THỜI GIAN ĐỀU ĐẶN CÂN XỨNG
    function formatTimeDisplay(timeStr) {
        if (timeStr === "OFF") return "OFF";
        if (timeStr.includes('/')) {
            const parts = timeStr.split('/');
            return `<div>${parts[0].trim()}</div><div>${parts[1].trim()}</div>`;
        }
        return `<div>${timeStr}</div>`;
    }

    function renderAll() {
        const startDate = getStartOfWeek(currentWeekOffset);
        const weekKey = getWeekKey(startDate);

        // Render Ngày / Tuần
        const endDate = new Date(startDate); endDate.setDate(endDate.getDate() + 6);
        document.getElementById('weekTitle').innerText = `${startDate.getDate()}/${startDate.getMonth()+1} - ${endDate.getDate()}/${endDate.getMonth()+1}`;

        // Header Bảng
        const headerRow = document.getElementById('dateHeaderRow');
        headerRow.innerHTML = `<th class="emp-col">Tên NV</th>`;
        for (let i = 0; i < 7; i++) {
            const d = new Date(startDate); d.setDate(d.getDate() + i);
            headerRow.innerHTML += `<th>${d.getDate()} ${DAYS_VN[i]}</th>`;
        }

        // Dropdown xóa NV
        const delSelect = document.getElementById('deleteEmpSelect');
        delSelect.innerHTML = `<option value="">-- Chọn NV cần xóa --</option>`;
        database.employees.forEach(e => {
            delSelect.innerHTML += `<option value="${e.id}">${e.name} (${e.dept})</option>`;
        });

        // Render Nội dung
        const tbody = document.getElementById('scheduleBody');
        tbody.innerHTML = '';
        const weekSchedule = database.schedules[weekKey] || {};

        database.departments.forEach(dept => {
            tbody.innerHTML += `<tr class="dept-row"><td colspan="8">${dept}</td></tr>`;
            const deptEmps = database.employees.filter(e => e.dept === dept);

            deptEmps.forEach(emp => {
                const empShifts = weekSchedule[emp.id] || Array(7).fill({ time: "OFF", note: "" });
                let trHtml = `<tr><td class="emp-name-cell">${emp.name}</td>`;

                empShifts.forEach((shiftObj, dayIdx) => {
                    const time = shiftObj.time || "OFF";
                    const note = shiftObj.note || "";
                    const styleClass = getShiftStyleClass(time);
                    const shiftColor = database.shiftColors[time] || getDefaultShiftColor(time);
                    const contrastColor = getContrastColor(shiftColor);
                    const shiftStyle = ` style="--shift-bg: ${shiftColor}; --shift-border: ${shiftColor}; --shift-contrast: ${contrastColor};"`;
                    const noteClass = note.trim() ? ' note-has-content' : '';

                    if (isEditMode) {
                        // CHẾ ĐỘ CHỈNH SỬA
                        let options = '';
                        database.shifts.forEach(s => {
                            options += `<option value="${s}" ${s === time ? 'selected' : ''}>${s}</option>`;
                        });

                        trHtml += `
                            <td class="shift-cell">
                                <div class="shift-badge ${styleClass}"${shiftStyle}>
                                    <select class="edit-select" onchange="updateShift(${emp.id}, ${dayIdx}, 'time', this.value)">
                                        ${options}
                                    </select>
                                    <input type="text" class="edit-note-input${noteClass}" value="${note}" placeholder="[Ghi chú]" onkeydown="handleEnter(event, () => updateShift(${emp.id}, ${dayIdx}, 'note', this.value))" onblur="updateShift(${emp.id}, ${dayIdx}, 'note', this.value)">
                                </div>
                            </td>`;
                    } else {
                        // CHẾ ĐỘ XEM (SẠCH SẼ, CÂN XỨNG, KHÔNG LỖI VIỀN/MŨI TÊN)
                        const formattedTime = formatTimeDisplay(time);
                        const noteHtml = note ? `<span class="note-tag">${note}</span>` : '';

                        trHtml += `
                            <td class="shift-cell">
                                <div class="shift-badge ${styleClass}"${shiftStyle}>
                                    <div class="time-text">${formattedTime}</div>
                                    ${noteHtml}
                                </div>
                            </td>`;
                    }
                });
                trHtml += `</tr>`;
                tbody.innerHTML += trHtml;
            });
        });

        const colorList = document.getElementById('shiftColorList');
        colorList.innerHTML = database.shifts.map(shift => {
            const color = database.shiftColors[shift] || getDefaultShiftColor(shift);
            return `<label class="shift-color-item" title="Đổi màu ${shift}">
                <span>${shift}</span>
                <input type="color" value="${color}" aria-label="Màu ${shift}" onchange="updateShiftColor('${shift.replace(/'/g, "\\'")}', this.value)">
            </label>`;
        }).join('');
    }

    window.onload = () => {
        document.getElementById('shiftInput').addEventListener('keydown', event => handleEnter(event, addShift));
        document.getElementById('empName').addEventListener('keydown', event => handleEnter(event, addEmployee));
        renderAll();
        loadFirebaseData();
    };
</script>

</body>
</html>
